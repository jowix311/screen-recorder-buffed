[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-recorder-buffed"
version = "0.1.0"
description = "Linux screen recorder that records meetings, translates speech to English and describes shared screens."
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.12.0",
]

[project.scripts]
screen-recorder-buffed = "screen_recorder_buffed.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
